[workspace]
resolver = "2"
members = [
  "crates/rewind-core",
  "crates/rewind-cli",
  "crates/rewind-assets",
  "crates/rewind-web",
  "crates/vendor/heatel",
  "crates/vendor/cs2-demoparser",
  "crates/vendor/csgoproto",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

# Demo parsing is CPU heavy; keep the parser and decoder optimized even in dev/test builds.
[profile.dev.package.cs2-demoparser]
opt-level = 3
[profile.dev.package.csgoproto]
opt-level = 3
[profile.dev.package.unsafe-libopus]
opt-level = 3
[profile.dev.package.heatel]
opt-level = 3
[profile.dev.package.meshoptimizer-rs]
opt-level = 3
[profile.dev.package.texture2ddecoder]
opt-level = 3
[profile.dev.package.rewind-core]
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 4
lto = "thin"
