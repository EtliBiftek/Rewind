[package]
name = "cs2-demoparser"
version = "0.1.1"
edition = "2021"
description = "Vendored copy of the `parser` crate from github.com/LaihoE/demoparser (MIT), rev dd71c09b32fb7ada7597bd83390a2ec3d3cd3812. Build scripts removed; generated sources committed so no protoc/git is needed at build time."
license = "MIT"
publish = false

[lib]
doctest = false

[lints.rust]
warnings = "allow"

[dependencies]
web-time = "1"
bitter = "0.7.0"
prost = "0.13.3"
snap = "1.1.0"
ahash = "0.8.3"
regex = "1.7.3"
phf = "0.11.1"
phf_macros = "0.11.1"
derive_more = "0.99.17"
itertools = "0.13.0"
lazy_static = "1.4.0"
bit_reverse = "0.1.8"
memmap2 = "0.9.4"
serde = { version = "1.0.164", features = ["derive"] }
libc = "0.2.147"
rayon = "1.7.0"
proc-macro2 = "1.0.69"
rand = "0.8.5"
bytes = "1.5.0"
csgoproto = { path = "../csgoproto" }
