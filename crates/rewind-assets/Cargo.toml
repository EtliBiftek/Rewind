[package]
name = "rewind-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reads the map geometry, materials and textures of the user's local CS2 install and converts a map to a cached binary glTF scene."

[dependencies]
web-time = "1"
heatel = { path = "../vendor/heatel", features = ["serde", "encode"] }
serde.workspace = true
serde_json.workspace = true
rayon = "1"
png = { version = "0.18", default-features = false }
jpeg-encoder = "0.6"

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
